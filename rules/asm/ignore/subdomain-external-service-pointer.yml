name: 'Subdomain Pointing to External Service'
description: >-
  This live subdomain has DNS CNAME records that resolve to external third-party services
  (e.g., AWS S3, Zendesk, GitHub Pages). Tracking these is critical for preventing
  Subdomain Takeover vulnerabilities, which occur when the external service is deleted
  or expires, but the DNS pointer remains active.
product: asm
severity: high
isUniversal: true
impact: >-
  Dangling DNS records pointing to unclaimed external services are vulnerable to Subdomain Takeover, allowing attackers to serve malicious content under your domain.
remediation: >-
  Regularly audit and remove stale CNAME records pointing to decommissioned external services (e.g., S3 buckets, GitHub Pages, Heroku).
references:
  - 'https://github.com/EdOverflow/can-i-take-over-xyz'
match:
  conditions:
    - field: type
      operator: '=='
      value: subdomain
    - field: properties.subdomain_status
      operator: '=='
      value: live
    - field: properties.cname_external
      operator: '=='
      value: true

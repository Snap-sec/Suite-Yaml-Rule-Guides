name: 'IP Responding to Ping/ICMP Requests'
description: >-
  This public-facing IP address responds to ICMP (ping) requests. This reveals
  asset existence to basic network sweepers, aiding attacker reconnaissance. While often
  required for diagnostic monitoring, widespread ICMP exposure unnecessarily increases
  the visible footprint of the attack surface.
product: asm
severity: low
isUniversal: true
impact: >-
  Responding to ICMP (ping) requests allows attackers to perform network reconnaissance and map live hosts on the internet.
remediation: >-
  Configure firewalls and security groups to drop inbound ICMP echo requests (ping) from the internet unless explicitly required for monitoring.
references:
  - 'https://www.cisa.gov/news-events/alerts/2015/09/25/understanding-denial-service-attacks'
match:
  conditions:
    - field: type
      operator: '=='
      value: ip
    - field: externally_reachable
      operator: '=='
      value: true
    - field: properties.icmp_enabled
      operator: '=='
      value: true
set:
  - field: exposure_reason
    value: IP address responds to ICMP/ping requests, exposing asset presence to external reconnaissance
  - field: risk
    value: low

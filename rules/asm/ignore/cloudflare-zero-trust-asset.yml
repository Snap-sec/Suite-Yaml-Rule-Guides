name: 'Asset Behind Cloudflare Zero Trust'
description: >-
  This asset is protected by Cloudflare Zero Trust (ZTNA/Access).
  These assets require authenticated, identity-aware access and generally represent
  a hardened, well-managed attack surface segment that is hidden from public scanning.
product: asm
severity: info
isUniversal: true
impact: >-
  While generally secure, misconfigurations in Zero Trust policies could lead to unauthorized access if identity providers are compromised.
remediation: >-
  Regularly review Zero Trust access policies, ensure least privilege, and enforce MFA for all users accessing the asset.
references:
  - 'https://www.cloudflare.com/learning/security/glossary/what-is-zero-trust/'
match:
  conditions:
    - field: type
      operator: '=='
      value: subdomain
    - field: properties.subdomain_status
      operator: '=='
      value: live
    - field: properties.cloudflare_zero_trust
      operator: '=='
      value: true
set:
  - field: exposure_reason
    value: Asset is behind Cloudflare Zero Trust — access requires identity verification
  - field: risk
    value: info

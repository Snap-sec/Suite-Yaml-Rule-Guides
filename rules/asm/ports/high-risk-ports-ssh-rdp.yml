name: 'Public Exposure of Remote Access Services'
description: >-
  A publicly accessible SSH (port 22) or RDP (port 3389) remote access service is exposed on this host.
  These ports are the most frequently targeted entry points for credential stuffing,
  brute-force attacks, and ransomware deployment. Exposing management interfaces directly
  to the internet without a VPN, bastion host, or Zero Trust architecture presents a
  critical security risk.
product: asm
severity: high
isUniversal: true
impact: >-
  Exposed management ports like SSH and RDP are frequent targets for brute-force attacks and credential stuffing, leading to potential system compromise.
remediation: >-
  Disable public access to SSH and RDP. Enforce access via VPN, Zero Trust Network Access (ZTNA), and require multi-factor authentication (MFA).
references:
  - 'https://www.cisa.gov/news-events/alerts/2019/12/17/securing-remote-desktop-protocol-rdp'
match:
  conditions:
    - field: type
      operator: '=='
      value: port
    - field: value
      operator: 'in'
      value: 22,3389,5900
      transformer: List

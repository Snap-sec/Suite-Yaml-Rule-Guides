name: 'Public Exposure of Remote Access Services'
description: >-
  Detects publicly accessible SSH (port 22) and RDP (port 3389) remote access services.
  These ports are among the most heavily targeted by automated scanners, botnets, and
  credential-stuffing campaigns. Exposed remote access services provide a direct path
  for attackers to gain interactive shell or desktop access, making them a critical
  entry point for ransomware deployment, lateral movement, and full environment compromise.
product: asm
severity: high
isUniversal: true
impact: >-
  Exposed management ports like SSH and RDP are frequent targets for brute-force attacks and credential stuffing, leading to potential system compromise.
remediation: >-
  Disable public access to SSH and RDP. Enforce access via VPN, Zero Trust Network Access (ZTNA), and require multi-factor authentication (MFA).
references:
  - 'https://www.cisa.gov/news-events/alerts/2019/12/17/securing-remote-desktop-protocol-rdp'
match:
  conditions:
    - field: type
      operator: '=='
      value: port
    - field: value
      operator: 'in'
      value: 22,3389,5900
      transformer: List

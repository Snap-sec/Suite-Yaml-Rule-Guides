name: 'Web Server on Non-Standard HTTP Port'
description: >-
  Detects web servers responding on non-standard HTTP/HTTPS ports (other than 80 and 443).
  Web services on unexpected ports may bypass security controls, WAF rules, or indicate
  shadow IT and misconfigured deployments.
product: asm
severity: medium
isUniversal: true
impact: >-
  Exposing web services on non-standard ports can evade some standard scanning but often indicates misconfigured or rogue services that bypass WAF or standard monitoring.
remediation: >-
  Restrict access to non-standard ports using firewall rules and ensure all web traffic is routed through standard ports (80/443) behind a WAF.
references:
  - 'https://owasp.org/www-project-top-ten/'
match:
  conditions:
    - field: type
      operator: '=='
      value: port
    - field: properties.port_status
      operator: '=='
      value: open
    - field: properties.port_service
      operator: 'in'
      transformer: 'List'
      value: 'http,https'
    - field: properties.port_number
      operator: 'not_in'
      value: '80,443'
      transformer: List
    - field: externally_reachable
      operator: '=='
      value: true

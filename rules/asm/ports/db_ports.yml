name: 'Publicly Exposed Database Port'
description: >-
  An open database service port (MySQL 3306, PostgreSQL 5432, Redis 6379,
  MongoDB 27017) was found publicly exposed to the internet on this host. Direct internet access to
  databases bypasses standard multi-tier security architectures, drastically increasing
  the risk of data breaches, credential brute-forcing, and ransomware attacks. Databases
  should never be directly accessible from external networks.
product: asm
severity: high
isUniversal: true
impact: >-
  Direct internet exposure of databases significantly increases the risk of unauthorized access, data breaches, and ransomware attacks.
remediation: >-
  Block external access to database ports (3306, 5432, etc.) at the network perimeter. Require VPN or bastion host access for database management.
references:
  - 'https://www.cisa.gov/news-events/alerts/2019/10/22/securing-databases'
match:
  conditions:
    - field: type
      operator: '=='
      value: port
    - field: value
      operator: 'in'
      value: 3306,5432,6379,27017
      transformer: List
    - field: properties.port_status
      operator: '=='
      value: open
    - field: properties.port_service_version
      operator: '!='
      value: cloudflare

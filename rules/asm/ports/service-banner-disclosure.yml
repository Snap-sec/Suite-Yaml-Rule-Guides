name: 'Service with Banner Disclosure'
description: >-
  An open port on this host is broadcasting a service banner that exposes the software name, version,
  or platform details (e.g., OpenSSH 8.2p1, Apache 2.4.41). Attackers heavily rely on
  banner grabbing during the reconnaissance phase to rapidly map the attack surface and
  match running services against known vulnerability databases (CVEs) or automated
  exploitation tools.
product: asm
severity: medium
isUniversal: true
impact: >-
  Information disclosure allows attackers to identify the specific software and version in use, facilitating targeted attacks using known exploits for that version.
remediation: >-
  Configure services to suppress banner information or return generic responses. Update server configurations to disable version exposure.
references:
  - 'https://cwe.mitre.org/data/definitions/200.html'
match:
  conditions:
    - field: type
      operator: '=='
      value: port
    - field: properties.port_status
      operator: '=='
      value: open
    - field: properties.port_banner
      operator: '!='
      value: null
    - field: externally_reachable
      operator: '=='
      value: true

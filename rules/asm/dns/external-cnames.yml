name: 'CNAME to External Domain'
description: >-
  A DNS CNAME record was found that aliases to a domain outside the organization's primary
  domain. External CNAMEs are a primary vector for Subdomain Takeover attacks if the
  destination service (e.g., S3 buckets, PaaS providers) is decommissioned or unclaimed,
  allowing an attacker to register the target and hijack the subdomain.
product: asm
severity: medium
isUniversal: false
impact: >-
  External CNAMEs inherently trust third-party infrastructure. If the third-party is compromised or the service is abandoned, it creates a takeover risk.
remediation: >-
  Audit external CNAMEs regularly. Ensure contracts and SLAs with third parties include security requirements. Remove unused records.
references:
  - 'https://portswigger.net/web-security/ssrf'
match:
  conditions:
    - field: type
      operator: '=='
      value: dns
    - field: properties.dns_class
      operator: '=='
      value: CNAME
    - field: value
      operator: 'regex'
      value: ^(?!site\.com$).+

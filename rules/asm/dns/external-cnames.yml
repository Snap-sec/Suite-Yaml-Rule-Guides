name: 'CNAME to External Domain'
description: >-
  Detects DNS CNAME records that alias to domains outside the organization's primary
  domain. External CNAME delegation transfers trust to a third party — if the target
  domain expires, is misconfigured, or is compromised, attackers can serve malicious
  content under the organization's domain. This is a common vector for subdomain
  takeover attacks and can undermine brand integrity and user trust.
product: asm
severity: medium
isUniversal: false
impact: >-
  External CNAMEs inherently trust third-party infrastructure. If the third-party is compromised or the service is abandoned, it creates a takeover risk.
remediation: >-
  Audit external CNAMEs regularly. Ensure contracts and SLAs with third parties include security requirements. Remove unused records.
references:
  - 'https://portswigger.net/web-security/ssrf'
match:
  conditions:
    - field: type
      operator: '=='
      value: dns
    - field: properties.dns_class
      operator: '=='
      value: CNAME
    - field: value
      operator: 'regex'
      value: ^(?!site\.com$).+

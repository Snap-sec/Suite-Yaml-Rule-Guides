name: 'Origin IP Address Disclosure via DNS'
description: >-
  A DNS A or AAAA record was found that exposes the true origin IP address of this asset,
  which is expected to be masked behind a CDN or Web Application Firewall (WAF).
  Origin IP disclosure allows attackers to bypass edge security controls (like Cloudflare
  or AWS Shield) and launch direct DDoS attacks or targeted exploits against the
  unprotected backend infrastructure.
product: asm
severity: high
isUniversal: false
impact: >-
  Disclosing the origin IP allows attackers to bypass DDoS protection and WAFs (like Cloudflare) by directly attacking the origin server.
remediation: >-
  Change the origin server IP and update firewall rules to only accept traffic from the CDN/WAF provider's IP ranges.
references:
  - 'https://www.cloudflare.com/learning/security/threats/origin-ip-exposure/'
match:
  conditions:
    - field: type
      operator: '=='
      value: dns
    - field: value
      operator: 'regex'
      value: ^(?!104\.18\.)(?!10\.)(?!127\.)(?!169\.254\.)(?!172\.(1[6-9]|2[0-9]|3[0-1])\.)(?!192\.168\.)\d{1,3}(\.\d{1,3}){3}$
    - field: properties.dns_class
      operator: 'in'
      value: A,AAAA
      transformer: List
name: 'Expired Certificates'
description: >-
  Detects SSL/TLS certificates within the asset inventory that have passed their
  expiration date. Expired certificates break the chain of trust, cause browser
  security warnings that erode user confidence, and may leave encrypted channels
  vulnerable to man-in-the-middle attacks. They can also indicate abandoned or
  unmaintained services that remain exposed without active security oversight.
product: asm
severity: medium
isUniversal: false
impact: >-
  Expired certificates result in browser warnings, degraded user trust, and potential man-in-the-middle (MitM) attacks due to failed validation.
remediation: >-
  Renew expired certificates immediately and implement automated certificate lifecycle management (e.g., Let's Encrypt, AWS ACM).
references:
  - 'https://www.cisa.gov/news-events/alerts/2017/02/09/understanding-digital-signatures'
match:
  conditions:
    - field: type
      operator: '=='
      value: certificate
    - field: properties.certificate_is_expired
      operator: '=='
      value: true

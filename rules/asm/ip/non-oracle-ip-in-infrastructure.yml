name: 'Non Oracle IP used in Infrastructure'
description: >-
  This IP address within the organization's asset inventory has a
  registered organization that is not Oracle Cloud (OCI). This helps identify infrastructure
  hosted outside the expected primary cloud provider, potentially highlighting shadow IT,
  multi-cloud sprawl, or misattributed assets.
product: asm
severity: medium
isUniversal: false
impact: >-
  Rogue IPs in the infrastructure can indicate unauthorized deployments or misconfigurations, potentially leading to unauthorized data flows.
remediation: >-
  Investigate and decommission unauthorized IP addresses. Implement strict change control for network infrastructure provisioning.
references:
  - 'https://www.cisecurity.org/controls/inventory-and-control-of-enterprise-assets'
match:
  conditions:
    - field: type
      operator: '=='
      value: ip
    - field: properties.ip_org
      operator: 'regex'
      value: ^(?!.*Oracle Corporation).*

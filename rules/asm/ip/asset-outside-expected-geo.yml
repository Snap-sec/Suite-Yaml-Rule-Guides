name: 'Asset Outside Expected Geo Location'
description: >-
  Detects IP assets hosted in geographic regions outside the organization's approved
  or expected country list. Assets in unexpected locations may indicate unauthorized
  infrastructure, shadow IT, compromised resources being re-routed, or violations of
  data residency and sovereignty regulations. Identifying these assets helps enforce
  compliance with geographic policies and reduces exposure from unmonitored regions.
product: asm
severity: high
isUniversal: false
impact: >-
  Assets hosted in unexpected geographic locations may violate data sovereignty regulations or indicate a compromised system communicating with foreign infrastructure.
remediation: >-
  Verify the legitimate need for the asset in the specific geographic region. If unauthorized, isolate the asset and review network access logs.
references:
  - 'https://www.cisecurity.org/controls/v8'
match:
  conditions:
    - field: type
      operator: '=='
      value: ip
    - field: properties.ip_country
      operator: 'not_in'
      value: SA
      transformer: List
    - field: network_scope
      operator: '=='
      value: external

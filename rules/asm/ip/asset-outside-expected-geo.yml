name: 'Asset Outside Expected Geo Location'
description: >-
  This IP asset is hosted in a geographic region outside the organization's approved
  or expected countries. This may indicate unauthorized cloud deployments, compromised
  infrastructure, or data sovereignty and compliance violations (e.g., GDPR, CCPA).
product: asm
severity: high
isUniversal: false
impact: >-
  Assets hosted in unexpected geographic locations may violate data sovereignty regulations or indicate a compromised system communicating with foreign infrastructure.
remediation: >-
  Verify the legitimate need for the asset in the specific geographic region. If unauthorized, isolate the asset and review network access logs.
references:
  - 'https://www.cisecurity.org/controls/v8'
match:
  conditions:
    - field: type
      operator: '=='
      value: ip
    - field: properties.ip_country
      operator: 'not_in'
      value: SA
      transformer: List
    - field: network_scope
      operator: '=='
      value: external

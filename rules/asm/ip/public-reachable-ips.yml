name: 'Externally Exposed IP Address'
description: >-
  This IP address within the organization's asset inventory is directly
  reachable from the public internet. This helps identify the true size of the external
  attack surface, distinguishing between internal-only subnets and internet-facing
  infrastructure that requires robust perimeter security monitoring.
product: asm
severity: critical
isUniversal: true
impact: >-
  Unintended public exposure of IP addresses can bypass security controls like CDNs or WAFs, leaving the underlying infrastructure vulnerable to direct attacks.
remediation: >-
  Audit network security groups and firewalls to ensure only intended services are publicly accessible. Route traffic through managed gateways.
references:
  - 'https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-41r1.pdf'
match:
  conditions:
    - field: type
      operator: '=='
      value: ip
    - field: externally_reachable
      operator: '=='
      value: true
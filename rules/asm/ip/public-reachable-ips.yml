name: 'Externally Exposed IP Address'
description: >-
  Detects IP addresses within the organization's asset inventory that are directly
  reachable from the public internet. Externally exposed IPs expand the attack surface
  by allowing adversaries to perform reconnaissance, port scanning, and service
  enumeration. Without proper hardening, firewall rules, or network segmentation,
  these IPs can become entry points for exploitation of vulnerable services,
  lateral movement, or denial-of-service attacks.
product: asm
severity: critical
isUniversal: true
impact: >-
  Unintended public exposure of IP addresses can bypass security controls like CDNs or WAFs, leaving the underlying infrastructure vulnerable to direct attacks.
remediation: >-
  Audit network security groups and firewalls to ensure only intended services are publicly accessible. Route traffic through managed gateways.
references:
  - 'https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-41r1.pdf'
match:
  conditions:
    - field: type
      operator: '=='
      value: ip
    - field: externally_reachable
      operator: '=='
      value: true
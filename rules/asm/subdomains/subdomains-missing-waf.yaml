name: 'Externally Exposed Subdomain Missing WAF'
description: >-
  This live, externally facing subdomain lacks Web Application Firewall (WAF)
  protection. Without a WAF, web applications are directly exposed to common attack
  vectors including SQL injection, cross-site scripting (XSS), request smuggling, and
  automated vulnerability scanning. WAF coverage gaps leave these subdomains as the
  path of least resistance for attackers targeting the organization's web perimeter.
product: asm
severity: high
isUniversal: true
impact: >-
  Subdomains without WAF protection are exposed to common application-layer attacks like SQLi, XSS, and botnets without automated mitigation.
remediation: >-
  Ensure all public-facing subdomains are routed through a Web Application Firewall (WAF) and enforce standard security policies.
references:
  - 'https://www.cloudflare.com/learning/ddos/glossary/web-application-firewall-waf/'
match:
  conditions:
    - field: type
      operator: '=='
      value: subdomain
    - field: properties.subdomain_status
      operator: '=='
      value: live
    - field: hasWaf
      operator: '=='
      value: false
    - field: network_scope
      operator: '=='
      value: external

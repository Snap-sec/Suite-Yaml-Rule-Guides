name: 'Exposing Server Version in Headers'
description: >-
  This web server discloses its software name or version through the
  HTTP Server response header. Revealing server technology and version details
  enables attackers to fingerprint the stack and quickly identify known CVEs,
  default credentials, or platform-specific exploit techniques. Suppressing
  this header is a low-effort hardening step that removes a valuable
  reconnaissance signal from the external attack surface.
product: asm
severity: info
isUniversal: false
impact: >-
  Revealing the server version allows attackers to easily identify known vulnerabilities (CVEs) associated with that specific version, accelerating exploit attempts.
remediation: >-
  Configure the web server (e.g., Nginx, Apache) to hide version information by setting `server_tokens off;` or equivalent directives.
references:
  - 'https://owasp.org/www-project-secure-headers/'
match:
  conditions:
    - field: type
      operator: '=='
      value: web_server
    - field: properties.subdomain_headers.server
      operator: 'regex'
      value: .
    - field: value
      operator: 'regex'
      value: "^(https?:\/\/)(?!10\\.)(?!127\\.)(?!169\\.254\\.)(?!172\\.(1[6-9]|2\\d|3[0-1])\\.)(?!192\\.168\\.)(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]?\\d)(?:\\.(?:25[0-5]|2[0-4]\\d|1\\d\\d|[1-9]?\\d)){3}:\\d{1,5}$"

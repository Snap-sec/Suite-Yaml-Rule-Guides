name: 'Live Web Server Responding on Public IP Address'
description: >-
  An externally reachable web server was found that returns an HTTP 200 OK response and
  is accessed directly via its public IP address rather than a domain name. These
  live, actively-serving endpoints lack CDN and WAF coverage, are indexed by automated
  IP-range scanners, and expose the true origin server — making them easy targets for
  exploitation, DDoS attacks, and credential brute-forcing.
product: asm
severity: critical
isUniversal: true
impact: >-
  Web servers responding directly to IP requests rather than domain names may bypass WAF protections and reveal origin infrastructure.
remediation: >-
  Configure web servers to only respond to valid host headers (domain names). Drop requests that use raw IP addresses in the host header.
references:
  - 'https://portswigger.net/web-security/host-header'
match:
  conditions:
    - field: type
      operator: '=='
      value: web_server
    - field: network_scope
      operator: '=='
      value: external
    - field: properties.subdomain_status_code
      operator: '=='
      value: 200
    - field: value
      operator: 'regex'
      value: (?!10\.)(?!127\.)(?!169\.254\.)(?!172\.(1[6-9]|2[0-9]|3[0-1])\.)(?!192\.168\.)\d{1,3}(\.\d{1,3}){3}
